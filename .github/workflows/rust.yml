name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            mode: native
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            mode: native
          - target: aarch64-apple-darwin
            os: macos-latest
            mode: native
          - target: x86_64-apple-darwin
            os: macos-latest
            mode: cross-darwin
          - target: aarch64-linux-android
            os: ubuntu-latest
            mode: android

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux runtime dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Android NDK
        if: matrix.mode == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Install cargo-ndk
        if: matrix.mode == 'android'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Check
        if: matrix.mode == 'native'
        run: cargo check --all-targets --locked

      - name: Build
        if: matrix.mode == 'native'
        run: cargo build --locked --verbose

      - name: Run tests
        if: matrix.mode == 'native'
        run: cargo test --locked --verbose

      - name: Check (x86_64-apple-darwin)
        if: matrix.mode == 'cross-darwin'
        run: cargo check --all-targets --target ${{ matrix.target }} --locked

      - name: Compile tests (x86_64-apple-darwin)
        if: matrix.mode == 'cross-darwin'
        run: cargo test --no-run --target ${{ matrix.target }} --locked

      - name: Build (x86_64-apple-darwin)
        if: matrix.mode == 'cross-darwin'
        run: cargo build --target ${{ matrix.target }} --locked --verbose

      - name: Check (Android API 24)
        if: matrix.mode == 'android'
        run: cargo ndk -t aarch64-linux-android -p 24 check --all-targets --locked

      - name: Compile tests (Android API 24)
        if: matrix.mode == 'android'
        run: cargo ndk -t aarch64-linux-android -p 24 test --no-run --locked

      - name: Build release (Android API 24)
        if: matrix.mode == 'android'
        run: cargo ndk -t aarch64-linux-android -p 24 build --release --locked
