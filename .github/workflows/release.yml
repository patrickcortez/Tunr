name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0; leave blank to build artifacts only)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            mode: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            mode: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            mode: cargo
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            mode: cargo
          - target: aarch64-linux-android
            os: ubuntu-latest
            archive: tar.gz
            mode: android

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-release
          key: ${{ matrix.target }}

      - name: Setup Android NDK
        if: matrix.mode == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Install cargo-ndk
        if: matrix.mode == 'android'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build release binary
        if: matrix.mode == 'cargo'
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Build release binary (Android API 24)
        if: matrix.mode == 'android'
        run: cargo ndk -t aarch64-linux-android -p 24 build --release --locked

      - name: Determine release version label
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${RELEASE_REF}" == refs/tags/* ]]; then
            version="${RELEASE_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            version="${INPUT_TAG}"
          else
            version="${GITHUB_SHA::7}"
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Package tar.gz archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/termusic-${VERSION}-${{ matrix.target }}.tar.gz" termusic

      - name: Package zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Force -Path "target/${{ matrix.target }}/release/termusic.exe" -DestinationPath "dist/termusic-${env:VERSION}-${{ matrix.target }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Checksums and GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum termusic-* | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Upload combined artifacts with SHA256SUMS
        if: ${{ !(startsWith(github.ref, 'refs/tags/') || inputs.tag) }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-all
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/termusic-*
            dist/SHA256SUMS
