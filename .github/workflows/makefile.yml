name: Makefile CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install runtime dependencies
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0

    - name: Run check
      run: make check

    - name: Run tests
      run: make test

    - name: Build
      run: make build
