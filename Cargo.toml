[package]
name = "termusic"
version = "0.1.0"
edition = "2024"
description = "Command-line music player with interactive TUI"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0"
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
libloading = "0.8"
rand = "0.10"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "flac", "wav", "ogg", "vorbis", "pcm"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time", "fs"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
